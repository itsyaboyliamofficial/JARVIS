<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        :root {
            --cyan: #00d9ff;
            --cyan-bright: #7df3ff;
            --blue: #008cff;
            --bg: #010407;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            background:
                radial-gradient(
                    circle at 50% 44%,
                    rgba(0, 145, 210, 0.12),
                    transparent 26%
                ),
                radial-gradient(
                    circle at 50% 50%,
                    rgba(0, 70, 110, 0.08),
                    transparent 45%
                ),
                #010407;

            color: #d9faff;
            font-family: "Orbitron", Arial, sans-serif;

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
            position: relative;
        }

        /* Background grid */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    rgba(0, 217, 255, 0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 217, 255, 0.035) 1px,
                    transparent 1px
                );

            background-size: 42px 42px;

            mask-image:
                radial-gradient(
                    circle at center,
                    black 10%,
                    transparent 78%
                );

            animation: gridDrift 18s linear infinite;
        }

        /* Scanlines */

        body::after {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0px,
                    transparent 4px,
                    rgba(0, 217, 255, 0.018) 5px,
                    transparent 6px
                );

            opacity: 0.7;

            z-index: 20;
        }

        /* Main interface */

        .container {
            text-align: center;

            width: min(92%, 820px);

            min-height: 680px;

            padding: 48px 34px 35px;

            position: relative;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            isolation: isolate;
        }

        /* HUD corner */

        .container::before,
        .container::after {
            content: "";

            position: absolute;

            width: 90px;
            height: 90px;

            border-color: rgba(0, 217, 255, 0.35);

            pointer-events: none;
        }

        .container::before {
            top: 22px;
            left: 0;

            border-top: 1px solid;
            border-left: 1px solid;
        }

        .container::after {
            bottom: 22px;
            right: 0;

            border-right: 1px solid;
            border-bottom: 1px solid;
        }

        /* Title */

        h1 {
            margin: 0 0 8px;

            font-size: clamp(38px, 7vw, 62px);

            font-weight: 700;

            letter-spacing: 14px;

            padding-left: 14px;

            color: #e9fdff;

            text-shadow:
                0 0 8px rgba(125, 243, 255, 0.9),
                0 0 28px rgba(0, 217, 255, 0.55),
                0 0 60px rgba(0, 140, 255, 0.3);

            animation: titlePulse 3s ease-in-out infinite;
        }

        .subtitle {
            color: rgba(125, 243, 255, 0.52);

            margin-bottom: 38px;

            font-size: 10px;

            letter-spacing: 5px;

            text-transform: uppercase;
        }

        /* =========================
           AI ORB
           ========================= */

        .orb {
            width: 245px;
            height: 245px;

            margin: 0 auto;

            border-radius: 50%;

            position: relative;

            background:
                radial-gradient(
                    circle at 48% 44%,
                    #ffffff 0%,
                    #b8fbff 2%,
                    #43e9ff 7%,
                    rgba(0, 217, 255, 0.9) 14%,
                    rgba(0, 120, 190, 0.62) 28%,
                    rgba(0, 45, 80, 0.48) 48%,
                    rgba(0, 10, 20, 0.96) 68%,
                    #010407 74%
                );

            border: 1px solid rgba(91, 238, 255, 0.7);

            box-shadow:
                inset 0 0 25px rgba(0, 217, 255, 0.55),
                inset 0 0 70px rgba(0, 140, 255, 0.25),
                0 0 18px rgba(0, 217, 255, 0.85),
                0 0 50px rgba(0, 140, 255, 0.5),
                0 0 105px rgba(0, 100, 180, 0.32);

            animation: orbFloat 4s ease-in-out infinite;

            transition:
                transform 0.3s,
                box-shadow 0.3s,
                filter 0.3s;
        }

        /* Inner energy ring */

        .orb::before {
            content: "";

            position: absolute;

            inset: -22px;

            border:
                1px solid
                rgba(0, 217, 255, 0.35);

            border-radius: 50%;

            box-shadow:
                0 0 14px rgba(0, 217, 255, 0.25),
                inset 0 0 14px rgba(0, 217, 255, 0.18);

            animation:
                ringSpin 9s linear infinite;
        }

        /* Outer energy ring */

        .orb::after {
            content: "";

            position: absolute;

            inset: -43px;

            border:
                1px dashed
                rgba(0, 140, 255, 0.28);

            border-radius: 50%;

            border-left-color:
                rgba(0, 217, 255, 0.8);

            border-right-color:
                rgba(0, 217, 255, 0.5);

            animation:
                ringSpinReverse 13s linear infinite;
        }

        /* Speaking state */

        .orb.active {
            animation:
                orbActive 0.9s ease-in-out infinite;

            filter: brightness(1.25);

            box-shadow:
                inset 0 0 35px rgba(0, 240, 255, 0.8),
                inset 0 0 90px rgba(0, 140, 255, 0.38),
                0 0 25px #00eaff,
                0 0 70px #008cff,
                0 0 135px rgba(0, 190, 255, 0.55),
                0 0 210px rgba(0, 100, 255, 0.28);
        }

        .orb.active::before {
            animation-duration: 2.5s;

            border-color:
                rgba(80, 240, 255, 0.7);
        }

        .orb.active::after {
            animation-duration: 4s;

            border-color:
                rgba(0, 217, 255, 0.55);
        }

        /* Mode */

        .mode {
            margin-top: 72px;

            font-size: 15px;

            font-weight: 500;

            letter-spacing: 5px;

            text-shadow:
                0 0 14px currentColor;
        }

        .mode::before {
            content: "◆";

            display: inline-block;

            margin-right: 12px;

            font-size: 8px;

            vertical-align: middle;

            animation:
                statusBlink 1.5s ease-in-out infinite;
        }

        .passive {
            color: #608797;
        }

        .active-text {
            color: var(--cyan);
        }

        /* Output */

        .output {
            margin-top: 18px;

            min-height: 34px;

            width: min(90%, 650px);

            padding: 12px 20px;

            color: #b8eaf3;

            font-size: 14px;

            letter-spacing: 1px;

            line-height: 1.6;

            border-top:
                1px solid
                rgba(0, 217, 255, 0.13);

            border-bottom:
                1px solid
                rgba(0, 217, 255, 0.13);

            text-shadow:
                0 0 8px
                rgba(125, 243, 255, 0.22);
        }

        /* Button */

        button {
            margin-top: 30px;

            padding: 14px 32px;

            position: relative;

            overflow: hidden;

            border:
                1px solid
                rgba(0, 217, 255, 0.75);

            border-radius: 2px;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 217, 255, 0.1),
                    rgba(0, 100, 160, 0.04)
                ),
                rgba(2, 13, 21, 0.9);

            color: #bdf7ff;

            font-family: "Orbitron", Arial, sans-serif;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 3px;

            cursor: pointer;

            box-shadow:
                0 0 12px rgba(0, 217, 255, 0.16),
                inset 0 0 12px rgba(0, 217, 255, 0.05);

            transition: 0.25s ease;
        }

        button::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.25),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left 0.5s;
        }

        button:hover {
            color: white;

            border-color: #62efff;

            background:
                rgba(0, 160, 210, 0.13);

            box-shadow:
                0 0 18px rgba(0, 217, 255, 0.4),
                0 0 45px rgba(0, 140, 255, 0.15),
                inset 0 0 18px rgba(0, 217, 255, 0.08);

            transform: translateY(-2px);
        }

        button:hover::before {
            left: 150%;
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        /* Status */

        .status {
            margin-top: 14px;

            color: #456675;

            font-size: 9px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        /* Animations */

        @keyframes orbFloat {

            0%,
            100% {
                transform:
                    translateY(0)
                    scale(1);
            }

            50% {
                transform:
                    translateY(-7px)
                    scale(1.025);
            }
        }

        @keyframes orbActive {

            0%,
            100% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.035);
            }

            50% {
                transform: scale(1.095);
            }

            75% {
                transform: scale(1.035);
            }
        }

        @keyframes ringSpin {

            from {
                transform:
                    rotate(0deg)
                    scaleX(1);
            }

            to {
                transform:
                    rotate(360deg)
                    scaleX(1);
            }
        }

        @keyframes ringSpinReverse {

            from {
                transform:
                    rotate(360deg)
                    rotateX(62deg);
            }

            to {
                transform:
                    rotate(0deg)
                    rotateX(62deg);
            }
        }

        @keyframes titlePulse {

            0%,
            100% {
                opacity: 0.92;

                text-shadow:
                    0 0 8px
                    rgba(125, 243, 255, 0.8),

                    0 0 28px
                    rgba(0, 217, 255, 0.45);
            }

            50% {
                opacity: 1;

                text-shadow:
                    0 0 10px
                    rgba(125, 243, 255, 1),

                    0 0 35px
                    rgba(0, 217, 255, 0.7),

                    0 0 70px
                    rgba(0, 140, 255, 0.3);
            }
        }

        @keyframes statusBlink {

            0%,
            100% {
                opacity: 0.35;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes gridDrift {

            from {
                transform:
                    translateY(0);
            }

            to {
                transform:
                    translateY(42px);
            }
        }

        /* Mobile */

        @media (max-width: 600px) {

            .container {
                min-height: 100vh;

                padding:
                    30px 18px;
            }

            h1 {
                letter-spacing: 8px;

                padding-left: 8px;
            }

            .orb {
                width: 195px;
                height: 195px;
            }

            .mode {
                margin-top: 62px;

                font-size: 12px;
            }

            .container::before,
            .container::after {
                width: 55px;
                height: 55px;
            }
        }

        /* Reduced motion */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration:
                    0.001ms !important;

                animation-iteration-count:
                    1 !important;

                scroll-behavior:
                    auto !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div
            style="
                position:absolute;
                top:32px;
                right:4px;
                color:rgba(0,217,255,.32);
                font-size:8px;
                letter-spacing:3px;
            "
        >
            SYS // 01
        </div>

        <div
            style="
                position:absolute;
                bottom:34px;
                left:4px;
                color:rgba(0,217,255,.25);
                font-size:8px;
                letter-spacing:2px;
            "
        >
            NEURAL INTERFACE
        </div>

        <h1>JARVIS</h1>

        <div class="subtitle">
            Artificial Intelligence Interface
        </div>

        <div id="orb" class="orb"></div>

        <div
            id="mode"
            class="mode passive"
        >
            PASSIVE MODE
        </div>

        <div
            id="output"
            class="output"
        >
            Say "Hey JARVIS"
        </div>

        <button onclick="startJarvis()">
            START JARVIS
        </button>

        <div
            id="status"
            class="status"
        >
            System offline
        </div>

    </div>


    <script type="module">

        /*
         * =====================================================
         * KOKORO TTS
         * Runs locally in the browser.
         * No system voice is used.
         * =====================================================
         */

        import {
            KokoroTTS
        } from
            "https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.web.js";


        /*
         * =====================================================
         * ELEMENTS
         * =====================================================
         */

        const orb =
            document.getElementById("orb");

        const mode =
            document.getElementById("mode");

        const output =
            document.getElementById("output");

        const status =
            document.getElementById("status");


        /*
         * =====================================================
         * JARVIS STATE
         * =====================================================
         */

        let jarvisRunning = false;

        let passiveMode = true;

        let recognitionRunning = false;

        let restarting = false;

        let jarvisTTS = null;

        let ttsReady = false;

        let currentAudio = null;

        let currentAudioURL = null;


        /*
         * British male Kokoro voice.
         */

        const JARVIS_VOICE =
            "bm_george";


        /*
         * =====================================================
         * SPEECH RECOGNITION
         * =====================================================
         */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        let recognition = null;


        if (SpeechRecognition) {

            recognition =
                new SpeechRecognition();

            /*
             * Continuous recognition is more appropriate
             * for a wake-word assistant.
             *
             * Chrome may still end recognition,
             * so onend() safely restarts it.
             */

            recognition.continuous = true;

            recognition.interimResults = false;

            recognition.lang = "en-US";


            /*
             * Recognition started
             */

            recognition.onstart =
                function () {

                    recognitionRunning = true;

                    status.textContent =
                        passiveMode
                            ? "Listening for wake word..."
                            : "Listening for command...";
                };


            /*
             * Recognition result
             */

            recognition.onresult =
                function (event) {

                    const transcript =
                        event.results[
                            event.results.length - 1
                        ][0]
                            .transcript
                            .trim()
                            .toLowerCase();


                    console.log(
                        "Heard:",
                        transcript
                    );


                    if (!jarvisRunning) {
                        return;
                    }


                    /*
                     * PASSIVE MODE
                     */

                    if (passiveMode) {

                        if (
                            transcript.includes(
                                "hey jarvis"
                            )
                        ) {

                            activateJarvis();

                        }

                        return;
                    }


                    /*
                     * ACTIVE MODE
                     */

                    processCommand(
                        transcript
                    );
                };


            /*
             * IMPORTANT:
             *
             * Do NOT restart recognition
             * directly from onerror().
             *
             * Chrome frequently reports
             * "aborted" when ending a session.
             *
             * onend() handles restarting instead.
             */

            recognition.onerror =
                function (event) {

                    recognitionRunning = false;

                    console.log(
                        "Speech recognition error:",
                        event.error
                    );


                    /*
                     * "aborted" is usually Chrome
                     * ending the current recognition
                     * session.
                     */

                    if (
                        event.error ===
                        "aborted"
                    ) {

                        return;
                    }


                    if (!jarvisRunning) {
                        return;
                    }


                    /*
                     * Other recoverable errors
                     * are handled by onend().
                     */
                };


            /*
             * Recognition ended
             */

            recognition.onend =
                function () {

                    recognitionRunning = false;


                    if (
                        !jarvisRunning ||
                        restarting
                    ) {

                        return;
                    }


                    restartRecognition();
                };
        }


        /*
         * =====================================================
         * KOKORO VOICE INITIALIZATION
         * =====================================================
         */

        async function detectTTSDevice() {

            try {

                if (
                    "gpu" in navigator &&
                    navigator.gpu &&
                    await navigator.gpu.requestAdapter()
                ) {

                    return "webgpu";
                }

            }
            catch (error) {

                console.log(
                    "WebGPU unavailable:",
                    error
                );
            }


            return "wasm";
        }


        async function initializeTTS() {

            try {

                status.textContent =
                    "Loading JARVIS voice...";


                /*
                 * Try WebGPU first.
                 */

                const ttsDevice =
                    await detectTTSDevice();


                console.log(
                    "Kokoro TTS device:",
                    ttsDevice
                );


                jarvisTTS =
                    await KokoroTTS.from_pretrained(
                        "onnx-community/Kokoro-82M-v1.0-ONNX",
                        {
                            dtype:
                                ttsDevice === "webgpu"
                                    ? "fp32"
                                    : "q8",

                            device:
                                ttsDevice
                        }
                    );


                ttsReady = true;


                console.log(
                    "Kokoro TTS loaded.",
                    jarvisTTS.list_voices
                        ? jarvisTTS.list_voices()
                        : jarvisTTS.voices
                );


                status.textContent =
                    "JARVIS voice ready.";


                return true;

            }
            catch (error) {

                console.error(
                    "Kokoro TTS initialization failed:",
                    error
                );


                ttsReady = false;


                status.textContent =
                    "JARVIS voice failed to load.";


                output.textContent =
                    "Unable to load the JARVIS voice.";


                return false;
            }
        }


        /*
         * Start loading the model immediately.
         */

        const ttsReadyPromise =
            initializeTTS();


        /*
         * =====================================================
         * JARVIS SPEAK
         * =====================================================
         */

        async function speak(text) {

            output.textContent =
                text;


            if (
                !jarvisTTS ||
                !ttsReady
            ) {

                status.textContent =
                    "Loading JARVIS voice...";


                const ready =
                    await ttsReadyPromise;


                if (
                    !ready ||
                    !jarvisTTS
                ) {

                    console.error(
                        "JARVIS TTS unavailable."
                    );

                    return;
                }
            }


            /*
             * Stop previous audio.
             */

            if (currentAudio) {

                currentAudio.pause();

                currentAudio.currentTime = 0;

                currentAudio = null;
            }


            if (currentAudioURL) {

                URL.revokeObjectURL(
                    currentAudioURL
                );

                currentAudioURL = null;
            }


            try {

                orb.classList.add(
                    "active"
                );


                status.textContent =
                    "JARVIS speaking...";


                /*
                 * Generate voice.
                 */

                const audio =
                    await jarvisTTS.generate(
                        text,
                        {
                            voice:
                                JARVIS_VOICE,

                            speed:
                                0.88
                        }
                    );


                /*
                 * Convert to WAV.
                 */

                let blob;


                if (
                    typeof audio.toBlob ===
                    "function"
                ) {

                    blob =
                        audio.toBlob();

                }
                else if (
                    audio.audio &&
                    audio.sampling_rate
                ) {

                    blob =
                        audio.toBlob
                            ? audio.toBlob()
                            : null;
                }


                if (!blob) {

                    throw new Error(
                        "Kokoro returned unsupported audio."
                    );
                }


                currentAudioURL =
                    URL.createObjectURL(
                        blob
                    );


                currentAudio =
                    new Audio(
                        currentAudioURL
                    );


                currentAudio.volume = 1;


                currentAudio.onended =
                    function () {

                        orb.classList.remove(
                            "active"
                        );


                        status.textContent =
                            passiveMode
                                ? 'Listening for "Hey JARVIS"...'
                                : "Awaiting command...";


                        if (currentAudioURL) {

                            URL.revokeObjectURL(
                                currentAudioURL
                            );

                            currentAudioURL = null;
                        }


                        currentAudio = null;
                    };


                currentAudio.onerror =
                    function (error) {

                        console.error(
                            "JARVIS audio error:",
                            error
                        );


                        orb.classList.remove(
                            "active"
                        );


                        status.textContent =
                            "Audio playback error.";


                        currentAudio = null;
                    };


                await currentAudio.play();

            }
            catch (error) {

                console.error(
                    "JARVIS speech generation failed:",
                    error
                );


                orb.classList.remove(
                    "active"
                );


                status.textContent =
                    "JARVIS voice error.";
            }
        }


        /*
         * =====================================================
         * START JARVIS
         * =====================================================
         */

        function startJarvis() {

            if (!recognition) {

                output.textContent =
                    "Speech recognition is not supported in this browser.";

                return;
            }


            if (jarvisRunning) {
                return;
            }


            jarvisRunning = true;

            passiveMode = true;


            mode.textContent =
                "PASSIVE MODE";

            mode.className =
                "mode passive";


            status.textContent =
                "Requesting microphone...";


            try {

                recognition.start();

            }
            catch (error) {

                console.log(
                    "Initial recognition start:",
                    error
                );
            }


            /*
             * Give the browser a moment
             * before JARVIS speaks.
             */

            setTimeout(
                () => {

                    speak(
                        "JARVIS online. Say Hey JARVIS when you require assistance."
                    );

                },
                800
            );
        }


        /*
         * =====================================================
         * ACTIVATE JARVIS
         * =====================================================
         */

        function activateJarvis() {

            passiveMode = false;


            mode.textContent =
                "ACTIVE MODE";


            mode.className =
                "mode active-text";


            status.textContent =
                "Awaiting command...";


            speak(
                "Yes?"
            );
        }


        /*
         * =====================================================
         * PROCESS COMMAND
         * =====================================================
         */

        function processCommand(command) {

            console.log(
                "Command:",
                command
            );


            /*
             * Remove wake word.
             */

            command =
                command
                    .replace(
                        "hey jarvis",
                        ""
                    )
                    .trim();


            /*
             * GREETINGS
             */

            if (
                command === "hello" ||
                command === "hi" ||
                command.includes(
                    "hello jarvis"
                )
            ) {

                speak(
                    "Good day. How may I assist you?"
                );


                returnToPassive();

                return;
            }


            /*
             * OPEN YOUTUBE
             */

            if (
                command.includes(
                    "open youtube"
                ) ||
                command === "youtube"
            ) {

                speak(
                    "Opening YouTube."
                );


                setTimeout(
                    () => {

                        window.open(
                            "https://www.youtube.com",
                            "_blank"
                        );

                    },
                    700
                );


                returnToPassive();

                return;
            }


            /*
             * OPEN SPOTIFY
             */

            if (
                command.includes(
                    "open spotify"
                ) ||
                command === "spotify"
            ) {

                speak(
                    "Opening Spotify."
                );


                setTimeout(
                    () => {

                        window.open(
                            "https://open.spotify.com",
                            "_blank"
                        );

                    },
                    700
                );


                returnToPassive();

                return;
            }


            /*
             * OPEN GOOGLE
             */

            if (
                command.includes(
                    "open google"
                ) ||
                command === "google"
            ) {

                speak(
                    "Opening Google."
                );


                setTimeout(
                    () => {

                        window.open(
                            "https://www.google.com",
                            "_blank"
                        );

                    },
                    700
                );


                returnToPassive();

                return;
            }


            /*
             * SEARCH GOOGLE
             */

            if (
                command.startsWith(
                    "search for"
                ) ||
                command.startsWith(
                    "google"
                )
            ) {

                let search =
                    command
                        .replace(
                            "search for",
                            ""
                        )
                        .replace(
                            "google",
                            ""
                        )
                        .trim();


                if (
                    search.length === 0
                ) {

                    speak(
                        "What would you like me to search for?"
                    );


                    returnToPassive();

                    return;
                }


                speak(
                    "Searching Google for " +
                    search
                );


                setTimeout(
                    () => {

                        window.open(
                            "https://www.google.com/search?q=" +
                            encodeURIComponent(
                                search
                            ),
                            "_blank"
                        );

                    },
                    700
                );


                returnToPassive();

                return;
            }


            /*
             * TIME
             */

            if (
                command.includes(
                    "what time"
                ) ||
                command === "time" ||
                command.includes(
                    "current time"
                )
            ) {

                const now =
                    new Date();


                const time =
                    now.toLocaleTimeString(
                        [],
                        {
                            hour:
                                "numeric",

                            minute:
                                "2-digit"
                        }
                    );


                speak(
                    "The current time is " +
                    time
                );


                returnToPassive();

                return;
            }


            /*
             * DATE
             */

            if (
                command.includes(
                    "what date"
                ) ||
                command === "date" ||
                command.includes(
                    "today's date"
                )
            ) {

                const now =
                    new Date();


                const date =
                    now.toLocaleDateString(
                        [],
                        {
                            weekday:
                                "long",

                            month:
                                "long",

                            day:
                                "numeric"
                        }
                    );


                speak(
                    "Today is " +
                    date
                );


                returnToPassive();

                return;
            }


            /*
             * HELP
             */

            if (
                command === "help" ||
                command.includes(
                    "what can you do"
                )
            ) {

                speak(
                    "I can open websites, search Google, tell you the time and date, and respond to basic commands."
                );


                returnToPassive();

                return;
            }


            /*
             * STOP JARVIS
             */

            if (
                command.includes(
                    "stop listening"
                ) ||
                command.includes(
                    "go offline"
                ) ||
                command === "shutdown"
            ) {

                speak(
                    "Going offline."
                );


                setTimeout(
                    () => {

                        stopJarvis();

                    },
                    1500
                );


                return;
            }


            /*
             * UNKNOWN COMMAND
             */

            speak(
                "I'm sorry, I don't currently have a command for that."
            );


            returnToPassive();
        }


        /*
         * =====================================================
         * RETURN TO PASSIVE MODE
         * =====================================================
         */

        function returnToPassive() {

            passiveMode = true;


            mode.textContent =
                "PASSIVE MODE";


            mode.className =
                "mode passive";


            status.textContent =
                'Listening for "Hey JARVIS"...';


            /*
             * Do NOT manually stop/start recognition.
             *
             * The recognition session can remain alive
             * and simply listen for the wake word.
             */
        }


        /*
         * =====================================================
         * SAFE RESTART SPEECH RECOGNITION
         * =====================================================
         */

        function restartRecognition() {

            if (
                !jarvisRunning ||
                !recognition
            ) {

                return;
            }


            if (
                recognitionRunning ||
                restarting
            ) {

                return;
            }


            restarting = true;


            /*
             * IMPORTANT:
             *
             * Give Chrome enough time to completely
             * close its previous recognition session.
             */

            setTimeout(
                () => {

                    if (!jarvisRunning) {

                        restarting = false;

                        return;
                    }


                    try {

                        recognition.start();

                    }
                    catch (error) {

                        /*
                         * Chrome can throw InvalidStateError
                         * if recognition is already starting.
                         *
                         * This is safe to ignore.
                         */

                        console.log(
                            "Recognition restart skipped:",
                            error
                        );
                    }


                    restarting = false;

                },
                1000
            );
        }


        /*
         * =====================================================
         * STOP JARVIS
         * =====================================================
         */

        function stopJarvis() {

            jarvisRunning = false;

            passiveMode = true;


            if (recognition) {

                try {

                    recognition.stop();

                }
                catch (error) {

                    console.log(
                        "Recognition stop:",
                        error
                    );
                }
            }


            if (currentAudio) {

                currentAudio.pause();

                currentAudio.currentTime = 0;

                currentAudio = null;
            }


            if (currentAudioURL) {

                URL.revokeObjectURL(
                    currentAudioURL
                );

                currentAudioURL = null;
            }


            recognitionRunning = false;

            restarting = false;


            mode.textContent =
                "OFFLINE";


            mode.className =
                "mode passive";


            status.textContent =
                "System offline";


            output.textContent =
                'Press "START JARVIS" to begin';


            orb.classList.remove(
                "active"
            );
        }


        /*
         * =====================================================
         * KEYBOARD SHORTCUT
         * =====================================================
         */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !jarvisRunning
                ) {

                    startJarvis();
                }
            }
        );


        /*
         * Expose functions for HTML buttons.
         */

        window.startJarvis =
            startJarvis;

        window.stopJarvis =
            stopJarvis;

    </script>

</body>
