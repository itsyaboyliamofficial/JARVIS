
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #05080d;
            color: #d9f3ff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 700px;
        }

        h1 {
            font-size: 48px;
            letter-spacing: 8px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6e8fa3;
            margin-bottom: 35px;
        }

        .orb {
            width: 220px;
            height: 220px;
            margin: auto;
            border-radius: 50%;
            background: radial-gradient( circle, #ffffff 0%, #8eeaff 8%, #008cff 35%, #003b68 60%, #06101c 75% );
            box-shadow: 0 0 30px #008cff, 0 0 70px #0066aa, 0 0 120px #003b68;
            animation: idle 3s infinite ease-in-out;
            transition: 0.3s;
        }

            .orb.active {
                animation: active 1s infinite ease-in-out;
                box-shadow: 0 0 40px #00c8ff, 0 0 90px #008cff, 0 0 150px #0066aa;
            }

        @keyframes idle {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }
        }

        @keyframes active {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        .mode {
            margin-top: 35px;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .passive {
            color: #6e8fa3;
        }

        .active-text {
            color: #00c8ff;
        }

        .output {
            margin-top: 20px;
            min-height: 30px;
            color: #b8d9e8;
            font-size: 18px;
        }

        button {
            margin-top: 30px;
            padding: 14px 30px;
            border: 1px solid #008cff;
            border-radius: 8px;
            background: #07131f;
            color: #9edfff;
            font-size: 16px;
            cursor: pointer;
        }

            button:hover {
                background: #0b2235;
            }

        .status {
            margin-top: 15px;
            color: #506b7c;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>JARVIS</h1>

        <div id="orb" class="orb"></div>

        <div id="mode" class="mode passive">
            PASSIVE MODE
        </div>

        <div id="output" class="output">
            Say "Hey JARVIS"
        </div>

        <button onclick="startJarvis()">
            START JARVIS
        </button>

        <div id="status" class="status">
            System offline
        </div>

    </div>

    <script type="module">
        /*
         * =====================================================
         * KOKORO TTS
         * Runs locally in the browser.
         * No system voice is used.
         * =====================================================
         */
        import { KokoroTTS } from "https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.web.js";


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const orb = document.getElementById("orb");
        const mode = document.getElementById("mode");
        const output = document.getElementById("output");
        const status = document.getElementById("status");


        /* =====================================================
           JARVIS STATE
        ===================================================== */

        let jarvisRunning = false;
        let passiveMode = true;
        let recognitionRunning = false;
        let restarting = false;

        let jarvisTTS = null;
        let ttsReady = false;
        let currentAudio = null;
        let currentAudioURL = null;

        // British male Kokoro voice for JARVIS.
        // Other British male options include: bm_fable, bm_george, bm_lewis, bm_daniel.
        const JARVIS_VOICE = "bm_george";

        // Kokoro runs with WebGPU when available and falls back to WASM.
        let ttsDevice = "wasm";


        /* =====================================================
           SPEECH RECOGNITION
        ===================================================== */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        let recognition = null;

        if (SpeechRecognition) {

            recognition = new SpeechRecognition();

            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.lang = "en-US";


            recognition.onstart = function () {

                recognitionRunning = true;

                status.textContent = passiveMode
                    ? "Listening for wake word..."
                    : "Listening for command...";
            };


            recognition.onresult = function (event) {

                const transcript =
                    event.results[0][0].transcript
                        .trim()
                        .toLowerCase();

                console.log(transcript);

                if (!jarvisRunning) {
                    return;
                }


                /* =============================================
                   PASSIVE MODE
                ============================================= */

                if (passiveMode) {

                    if (
                        transcript.includes("hey jarvis") ||
                        transcript.includes("hey jarvis")
                    ) {

                        activateJarvis();

                    } else {

                        restartRecognition();
                    }

                    return;
                }


                /* =============================================
                   ACTIVE MODE
                ============================================= */

                processCommand(transcript);
            };


            recognition.onerror = function (event) {

                recognitionRunning = false;

                console.log("Speech recognition error:", event.error);

                if (!jarvisRunning) {
                    return;
                }

                restartRecognition();
            };


            recognition.onend = function () {

                recognitionRunning = false;

                if (
                    jarvisRunning &&
                    !restarting
                ) {
                    restartRecognition();
                }
            };

        }


        /* =====================================================
           KOKORO VOICE INITIALIZATION
        ===================================================== */

        async function detectTTSDevice() {

            try {

                if (
                    "gpu" in navigator &&
                    navigator.gpu &&
                    await navigator.gpu.requestAdapter()
                ) {
                    return "webgpu";
                }

            } catch (error) {

                console.log("WebGPU unavailable, using WASM:", error);

            }

            return "wasm";
        }


        async function initializeTTS() {

            try {

                status.textContent =
                    "Loading JARVIS voice and detecting GPU...";

                // Use the GPU when the browser supports WebGPU.
                // This is much faster than the WASM fallback on most PCs.
                ttsDevice = await detectTTSDevice();

                console.log(
                    "Kokoro TTS device:",
                    ttsDevice
                );

                jarvisTTS =
                    await KokoroTTS.from_pretrained(
                        "onnx-community/Kokoro-82M-v1.0-ONNX",
                        {
                            dtype:
                                ttsDevice === "webgpu"
                                    ? "fp32"
                                    : "q8",

                            device:
                                ttsDevice
                        }
                    );

                ttsReady = true;

                console.log(
                    "Kokoro TTS loaded.",
                    jarvisTTS.list_voices
                        ? jarvisTTS.list_voices()
                        : jarvisTTS.voices
                );

                status.textContent =
                    ttsDevice === "webgpu"
                        ? "JARVIS voice ready — GPU acceleration."
                        : "JARVIS voice ready — CPU/WASM mode.";

                return true;

            } catch (error) {

                console.error(
                    "Kokoro TTS initialization failed:",
                    error
                );

                ttsReady = false;

                status.textContent =
                    "JARVIS voice failed to load.";

                output.textContent =
                    "Unable to load the JARVIS voice.";

                return false;
            }
        }


        // Start loading the model as soon as the page opens.
        const ttsReadyPromise =
            initializeTTS();


        /* =====================================================
           JARVIS SPEAK
        ===================================================== */



        async function speak(text) {

            output.textContent = text;

            if (!jarvisTTS || !ttsReady) {

                status.textContent =
                    "Loading JARVIS voice...";

                const ready =
                    await ttsReadyPromise;

                if (!ready || !jarvisTTS) {

                    console.error(
                        "JARVIS TTS is not available."
                    );

                    return;
                }
            }


            /*
             * Stop any previous JARVIS audio.
             */

            if (currentAudio) {

                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;

            }


            if (currentAudioURL) {

                URL.revokeObjectURL(
                    currentAudioURL
                );

                currentAudioURL = null;
            }


            try {

                orb.classList.add("active");

                status.textContent =
                    "JARVIS speaking...";


                /*
                 * Generate speech using the fixed
                 * British male Kokoro voice.
                 */

                const audio =
                    await jarvisTTS.generate(
                        text,
                        {
                            voice:
                                JARVIS_VOICE,

                            speed: 0.88
                        }
                    );


                /*
                 * Convert the generated waveform
                 * into a playable WAV Blob.
                 */

                let blob;

                if (typeof audio.toBlob === "function") {
                    blob = audio.toBlob();
                } else if (audio.audio && audio.sampling_rate) {
                    blob = audio.toBlob
                        ? audio.toBlob()
                        : null;
                }

                if (!blob) {
                    throw new Error(
                        "Kokoro returned audio in an unsupported format."
                    );
                }

                currentAudioURL =
                    URL.createObjectURL(blob);

                currentAudio =
                    new Audio(
                        currentAudioURL
                    );

                currentAudio.volume = 1;


                currentAudio.onended =
                    function () {

                        orb.classList.remove(
                            "active"
                        );

                        status.textContent =
                            passiveMode
                                ? 'Listening for "Hey JARVIS"...'
                                : "Awaiting command...";

                        if (currentAudioURL) {

                            URL.revokeObjectURL(
                                currentAudioURL
                            );

                            currentAudioURL = null;
                        }

                        currentAudio = null;
                    };


                currentAudio.onerror =
                    function (error) {

                        console.error(
                            "JARVIS audio error:",
                            error
                        );

                        orb.classList.remove(
                            "active"
                        );

                        status.textContent =
                            "Audio playback error.";

                        currentAudio = null;
                    };


                await currentAudio.play();


            } catch (error) {

                console.error(
                    "JARVIS speech generation failed:",
                    error
                );

                orb.classList.remove(
                    "active"
                );

                status.textContent =
                    "JARVIS voice error.";
            }
        }


        /* =====================================================
           START JARVIS
        ===================================================== */

        function startJarvis() {

            if (!recognition) {
                output.textContent =
                    "Speech recognition is not supported in this browser.";
                return;
            }

            if (jarvisRunning) {
                return;
            }

            jarvisRunning = true;
            passiveMode = true;

            mode.textContent = "PASSIVE MODE";
            mode.className = "mode passive";

            status.textContent = "Requesting permissions...";

            /*
               Ask Chrome for microphone permission.
            */
            try {
                recognition.start();
            } catch (error) {
                console.log(error);
            }

            /*
               Attempt a popup from the user's button click.
               Chrome may allow it automatically because this
               code is running directly from the button click.
            */
            const popup = window.open(
                "about:blank",
                "_blank"
            );

            if (popup) {
                popup.close();

                status.textContent =
                    "Microphone and popup access ready.";
            } else {
                status.textContent =
                    "Microphone ready. Popups may be blocked.";
            }

            /*
               Give the browser a moment before JARVIS speaks.
            */
            setTimeout(() => {

                speak(
                    "JARVIS online. Say Hey JARVIS when you require assistance."
                );

            }, 800);
        }


        /* =====================================================
           ACTIVATE JARVIS
        ===================================================== */

        function activateJarvis() {

            passiveMode = false;


            mode.textContent =
                "ACTIVE MODE";

            mode.className =
                "mode active-text";


            status.textContent =
                "Awaiting command...";


            speak("Yes?");


            /*
               Give the voice a moment to finish.
            */

            setTimeout(() => {

                restartRecognition();

            }, 1000);
        }


        /* =====================================================
           PROCESS COMMAND
        ===================================================== */

        function processCommand(command) {

            console.log("Command:", command);


            /* =============================================
               REMOVE WAKE WORD IF PRESENT
            ============================================= */

            command = command
                .replace("hey jarvis", "")
                .trim();


            /* =============================================
               GREETINGS
            ============================================= */

            if (
                command === "hello" ||
                command === "hi" ||
                command.includes("hello jarvis")
            ) {

                speak("Good day. How may I assist you?");

                returnToPassive();

                return;
            }


            /* =============================================
               OPEN YOUTUBE
            ============================================= */

            if (
                command.includes("open youtube") ||
                command === "youtube"
            ) {

                speak("Opening YouTube.");

                setTimeout(() => {

                    window.open(
                        "https://www.youtube.com",
                        "_blank"
                    );

                }, 700);

                returnToPassive();

                return;
            }


            /* =============================================
               OPEN SPOTIFY
            ============================================= */

            if (
                command.includes("open spotify") ||
                command === "spotify"
            ) {

                speak("Opening Spotify.");

                setTimeout(() => {

                    window.open(
                        "https://open.spotify.com",
                        "_blank"
                    );

                }, 700);

                returnToPassive();

                return;
            }


            /* =============================================
               OPEN GOOGLE
            ============================================= */

            if (
                command.includes("open google") ||
                command === "google"
            ) {

                speak("Opening Google.");

                setTimeout(() => {

                    window.open(
                        "https://www.google.com",
                        "_blank"
                    );

                }, 700);

                returnToPassive();

                return;
            }


            /* =============================================
               SEARCH GOOGLE
            ============================================= */

            if (
                command.startsWith("search for") ||
                command.startsWith("google")
            ) {

                let search = command
                    .replace("search for", "")
                    .replace("google", "")
                    .trim();


                if (search.length === 0) {

                    speak("What would you like me to search for?");

                    returnToPassive();

                    return;
                }


                speak(
                    "Searching Google for " + search
                );


                setTimeout(() => {

                    window.open(
                        "https://www.google.com/search?q=" +
                        encodeURIComponent(search),
                        "_blank"
                    );

                }, 700);


                returnToPassive();

                return;
            }


            /* =============================================
               TIME
            ============================================= */

            if (
                command.includes("what time") ||
                command === "time" ||
                command.includes("current time")
            ) {

                const now = new Date();

                const time =
                    now.toLocaleTimeString(
                        [],
                        {
                            hour: "numeric",
                            minute: "2-digit"
                        }
                    );


                speak(
                    "The current time is " +
                    time
                );


                returnToPassive();

                return;
            }


            /* =============================================
               DATE
            ============================================= */

            if (
                command.includes("what date") ||
                command === "date" ||
                command.includes("today's date")
            ) {

                const now = new Date();

                const date =
                    now.toLocaleDateString(
                        [],
                        {
                            weekday: "long",
                            month: "long",
                            day: "numeric"
                        }
                    );


                speak(
                    "Today is " +
                    date
                );


                returnToPassive();

                return;
            }


            /* =============================================
               HELP
            ============================================= */

            if (
                command === "help" ||
                command.includes("what can you do")
            ) {

                speak(
                    "I can open websites, search Google, " +
                    "tell you the time and date, and respond " +
                    "to basic commands."
                );


                returnToPassive();

                return;
            }


            /* =============================================
               STOP JARVIS
            ============================================= */

            if (
                command.includes("stop listening") ||
                command.includes("go offline") ||
                command === "shutdown"
            ) {

                speak("Going offline.");

                setTimeout(() => {

                    stopJarvis();

                }, 1500);

                return;
            }


            /* =============================================
               UNKNOWN COMMAND
            ============================================= */

            speak(
                "I'm sorry, I don't currently have a command for that."
            );


            returnToPassive();
        }


        /* =====================================================
           RETURN TO PASSIVE MODE
        ===================================================== */

        function returnToPassive() {

            passiveMode = true;


            mode.textContent =
                "PASSIVE MODE";

            mode.className =
                "mode passive";


            status.textContent =
                'Listening for "Hey JARVIS"...';


            /*
               Give speech synthesis time to finish.
            */

            setTimeout(() => {

                restartRecognition();

            }, 1500);
        }


        /* =====================================================
           RESTART SPEECH RECOGNITION
        ===================================================== */

        function restartRecognition() {

            if (!jarvisRunning) {
                return;
            }


            if (!recognition) {
                return;
            }


            if (recognitionRunning) {
                return;
            }


            if (restarting) {
                return;
            }


            restarting = true;


            setTimeout(() => {

                try {

                    recognition.start();

                } catch (error) {

                    console.log(
                        "Recognition restart:",
                        error
                    );

                }


                restarting = false;

            }, 500);
        }


        /* =====================================================
           STOP JARVIS
        ===================================================== */

        function stopJarvis() {

            jarvisRunning = false;

            passiveMode = true;


            if (recognition) {

                try {
                    recognition.stop();
                } catch (error) { }

            }


            if (currentAudio) {

                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;

            }

            if (currentAudioURL) {

                URL.revokeObjectURL(
                    currentAudioURL
                );

                currentAudioURL = null;
            }


            recognitionRunning = false;


            mode.textContent =
                "OFFLINE";

            mode.className =
                "mode passive";


            status.textContent =
                "System offline";


            output.textContent =
                'Press "START JARVIS" to begin';


            orb.classList.remove("active");
        }


        /* =====================================================
           KEYBOARD SHORTCUT
        ===================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !jarvisRunning
                ) {

                    startJarvis();

                }

            }
        );

        /*
         * The page uses an inline button handler for START JARVIS.
         * Expose the function globally so the handler can still work
         * after converting this script to an ES module.
         */

        window.startJarvis = startJarvis;
        window.stopJarvis = stopJarvis;

    </script>

</body>
</html>
