```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #05080d;
            color: #d9f3ff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 700px;
        }

        h1 {
            font-size: 48px;
            letter-spacing: 8px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6e8fa3;
            margin-bottom: 35px;
        }

        .orb {
            width: 220px;
            height: 220px;
            margin: auto;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                #ffffff 0%,
                #8eeaff 8%,
                #008cff 35%,
                #003b68 60%,
                #06101c 75%
            );
            box-shadow:
                0 0 30px #008cff,
                0 0 70px #0066aa,
                0 0 120px #003b68;
            animation: idle 3s infinite ease-in-out;
            transition: 0.3s;
        }

        .orb.active {
            animation: active 1s infinite ease-in-out;
            box-shadow:
                0 0 40px #00c8ff,
                0 0 90px #008cff,
                0 0 150px #0066aa;
        }

        @keyframes idle {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }
        }

        @keyframes active {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        .mode {
            margin-top: 35px;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .passive {
            color: #6e8fa3;
        }

        .active-text {
            color: #00c8ff;
        }

        .output {
            margin-top: 20px;
            min-height: 30px;
            color: #b8d9e8;
            font-size: 18px;
        }

        button {
            margin-top: 30px;
            padding: 14px 30px;
            border: 1px solid #008cff;
            border-radius: 8px;
            background: #07131f;
            color: #9edfff;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0b2235;
        }

        .status {
            margin-top: 15px;
            color: #506b7c;
            font-size: 13px;
        }
    </styl
