
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS</title>

    <style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap');

* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020508;
    color: #dffbff;
    font-family: 'Orbitron', Arial, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
        radial-gradient(circle at 50% 42%, rgba(0, 225, 255, .11), transparent 24%),
        radial-gradient(circle at 50% 50%, rgba(0, 110, 255, .07), transparent 46%),
        #020508;
}

/* Fine technical grid */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .24;
    background-image:
        linear-gradient(rgba(0, 220, 255, .07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 220, 255, .07) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(circle at center, black 0%, transparent 76%);
}

/* Moving scanline */
body::after {
    content: "";
    position: fixed;
    left: 0;
    right: 0;
    height: 2px;
    top: -10px;
    pointer-events: none;
    background: rgba(91, 239, 255, .18);
    box-shadow: 0 0 22px rgba(0, 225, 255, .45);
    animation: scan 7s linear infinite;
}

@keyframes scan {
    to { top: 110vh; }
}

.container {
    width: min(720px, 92vw);
    min-height: 680px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 54px 34px 42px;
    border: 1px solid rgba(0, 220, 255, .25);
    background:
        linear-gradient(145deg, rgba(4, 19, 25, .78), rgba(1, 7, 11, .90));
    box-shadow:
        0 0 0 1px rgba(0, 220, 255, .05) inset,
        0 0 60px rgba(0, 180, 255, .09),
        0 35px 100px rgba(0, 0, 0, .55);
    clip-path: polygon(
        0 28px, 28px 0, calc(100% - 28px) 0, 100% 28px,
        100% calc(100% - 28px), calc(100% - 28px) 100%,
        28px 100%, 0 calc(100% - 28px)
    );
}

.container::before {
    content: "";
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(0, 220, 255, .08);
    pointer-events: none;
    clip-path: inherit;
}

.container::after {
    content: "JARVIS // NEURAL COMMAND INTERFACE";
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(101, 237, 255, .42);
    font-size: 8px;
    letter-spacing: 4px;
    white-space: nowrap;
}

h1 {
    margin: 0 0 24px;
    font-size: clamp(34px, 7vw, 58px);
    font-weight: 700;
    letter-spacing: 13px;
    padding-left: 13px;
    color: #e9fdff;
    text-shadow:
        0 0 8px rgba(107, 242, 255, .85),
        0 0 30px rgba(0, 213, 255, .42);
}

/* Corner HUD marks */
.container > div:first-child,
.container > div:nth-child(2) {
    font-family: monospace;
}

/* Core orb */
.orb {
    width: 218px;
    height: 218px;
    position: relative;
    border-radius: 50%;
    margin: 6px 0 35px;
    background:
        radial-gradient(circle at 50% 50%,
            #e8ffff 0 2%,
            rgba(83, 238, 255, .98) 5%,
            rgba(0, 185, 255, .45) 18%,
            rgba(0, 87, 156, .13) 42%,
            transparent 67%);
    box-shadow:
        0 0 18px rgba(72, 239, 255, .9),
        0 0 50px rgba(0, 207, 255, .48),
        0 0 105px rgba(0, 139, 255, .18);
    animation: corePulse 3.2s ease-in-out infinite;
}

.orb::before,
.orb::after {
    content: "";
    position: absolute;
    inset: -17px;
    border: 1px solid rgba(80, 234, 255, .38);
    border-radius: 50%;
}

.orb::before {
    border-top-color: rgba(225, 252, 255, .9);
    border-bottom-color: rgba(0, 214, 255, .08);
    animation: spin 8s linear infinite;
}

.orb::after {
    inset: -34px;
    border-color: rgba(0, 207, 255, .13);
    border-left-color: rgba(91, 239, 255, .65);
    border-right-color: rgba(91, 239, 255, .65);
    animation: spinReverse 12s linear infinite;
}

.orb.active {
    animation: speaking 1s ease-in-out infinite;
    box-shadow:
        0 0 25px rgba(110, 246, 255, 1),
        0 0 70px rgba(0, 217, 255, .7),
        0 0 130px rgba(0, 142, 255, .3);
}

@keyframes corePulse {
    0%, 100% { transform: scale(.96); opacity: .88; }
    50% { transform: scale(1.04); opacity: 1; }
}

@keyframes speaking {
    0%, 100% { transform: scale(.96); }
    50% { transform: scale(1.08); }
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes spinReverse { to { transform: rotate(-360deg); } }

.mode {
    margin-top: 6px;
    padding: 8px 18px;
    border: 1px solid rgba(0, 220, 255, .28);
    background: rgba(0, 170, 210, .06);
    color: #7feeff;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    box-shadow: 0 0 18px rgba(0, 190, 255, .06) inset;
}

.output {
    width: min(580px, 90%);
    min-height: 72px;
    margin: 24px 0 20px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.7;
    color: #d9fbff;
    font-family: monospace;
    font-size: 14px;
    letter-spacing: .4px;
    border-left: 2px solid rgba(0, 224, 255, .35);
    border-right: 2px solid rgba(0, 224, 255, .35);
    background: linear-gradient(90deg, transparent, rgba(0, 213, 255, .055), transparent);
    text-shadow: 0 0 12px rgba(97, 239, 255, .35);
}

button {
    position: relative;
    margin-top: 10px;
    min-width: 220px;
    padding: 14px 28px;
    border: 1px solid rgba(103, 241, 255, .7);
    color: #dfffff;
    background: rgba(0, 175, 220, .08);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    cursor: pointer;
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px),
                       calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
    box-shadow:
        0 0 20px rgba(0, 205, 255, .12),
        0 0 0 1px rgba(0, 220, 255, .04) inset;
    transition: .2s ease;
}

button::before {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1px solid rgba(104, 241, 255, .12);
    pointer-events: none;
}

button:hover {
    background: rgba(0, 213, 255, .16);
    box-shadow:
        0 0 26px rgba(0, 220, 255, .3),
        0 0 55px rgba(0, 170, 255, .12);
    transform: translateY(-1px);
}

button:active { transform: translateY(1px); }

.status {
    margin-top: 18px;
    color: rgba(159, 235, 248, .56);
    font-family: monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

@media (max-width: 600px) {
    .container {
        min-height: 620px;
        padding: 45px 20px 35px;
    }
    .orb { width: 175px; height: 175px; }
    .output { font-size: 12px; }
    .container::after { letter-spacing: 2px; font-size: 7px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

    <div class="container">
        <div style="position:absolute; top:32px; right:4px; color:rgba(0,217,255,.32); font-size:8px; letter-spacing:3px;">SYS // 01</div>
        <div style="position:absolute; bottom:34px; left:4px; color:rgba(0,217,255,.25); font-size:8px; letter-spacing:2px;">Version: 1.0</div>

        <h1>JARVIS</h1>

        <div id="orb" class="orb"></div>

        <div id="mode" class="mode passive">
            PASSIVE MODE
        </div>

        <div id="output" class="output">
            Say "Hey JARVIS"
        </div>

        <button onclick="startJarvis()">
            START JARVIS
        </button>

        <div id="status" class="status">
            System offline
        </div>

    </div>

    <script type="module">
        /*
         * =====================================================
         * KOKORO TTS
         * Runs locally in the browser.
         * No system voice is used.
         * =====================================================
         */
        import { KokoroTTS } from "https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.web.js";


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const orb = document.getElementById("orb");
        const mode = document.getElementById("mode");
        const output = document.getElementById("output");
        const status = document.getElementById("status");


        /* =====================================================
           JARVIS STATE
        ===================================================== */

        let jarvisRunning = false;
        let passiveMode = true;
        let recognitionRunning = false;
        let restarting = false;

        let jarvisTTS = null;
        let ttsReady = false;
        let currentAudio = null;
        let currentAudioURL = null;

        // British male Kokoro voice for JARVIS.
        // Other British male options include: bm_fable, bm_george, bm_lewis, bm_daniel.
        const JARVIS_VOICE = "bm_george";

        // Kokoro runs with WebGPU when available and falls back to WASM.
        let ttsDevice = "wasm";


        /* =====================================================
           SPEECH RECOGNITION
        ===================================================== */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        let recognition = null;

        if (SpeechRecognition) {

            recognition = new SpeechRecognition();

            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.lang = "en-US";


            recognition.onstart = function () {

                recognitionRunning = true;

                status.textContent = passiveMode
                    ? "Listening for wake word..."
                    : "Listening for command...";
            };


            recognition.onresult = function (event) {

                const transcript =
                    event.results[0][0].transcript
                        .trim()
                        .toLowerCase();

                console.log(transcript);

                if (!jarvisRunning) {
                    return;
                }


                /* =============================================
                   PASSIVE MODE
                ============================================= */

                if (passiveMode) {

                    if (
                        transcript.includes("hey jarvis") ||
                        transcript.includes("hey jarvis")
                    ) {

                        activateJarvis();

                    } else {

                        restartRecognition();
                    }

                    return;
                }


                /* =============================================
                   ACTIVE MODE
                ============================================= */

                processCommand(transcript);
            };


            recognition.onerror = function (event) {

                recognitionRunning = false;

                console.log("Speech recognition error:", event.error);

                if (!jarvisRunning) {
                    return;
                }

                restartRecognition();
            };


            recognition.onend = function () {

                recognitionRunning = false;

                if (
                    jarvisRunning &&
                    !restarting
                ) {
                    restartRecognition();
                }
            };

        }


        /* =====================================================
           KOKORO VOICE INITIALIZATION
        ===================================================== */

        async function detectTTSDevice() {

            try {

                if (
                    "gpu" in navigator &&
                    navigator.gpu &&
                    await navigator.gpu.requestAdapter()
                ) {
                    return "webgpu";
                }

            } catch (error) {

                console.log("WebGPU unavailable, using WASM:", error);

            }

            return "wasm";
        }


        async function initializeTTS() {

            try {

                status.textContent =
                    "Loading JARVIS voice...";

                ttsDevice = "wasm";

                console.log(
                    "Kokoro TTS device:",
                    ttsDevice
                );

                jarvisTTS =
                    await KokoroTTS.from_pretrained(
                        "onnx-community/Kokoro-82M-v1.0-ONNX",
                        {
                            dtype:
                                ttsDevice === "webgpu"
                                    ? "fp32"
                                    : "q8",

                            device:
                                ttsDevice
                        }
                    );

                ttsReady = true;

                console.log(
                    "Kokoro TTS loaded.",
                    jarvisTTS.list_voices
                        ? jarvisTTS.list_voices()
                        : jarvisTTS.voices
                );

                status.textContent =
                    "JARVIS voice ready.";

                return true;

            } catch (error) {

                console.error(
                    "Kokoro TTS initialization failed:",
                    error
                );

                ttsReady = false;

                status.textContent =
                    "JARVIS voice failed to load.";

                output.textContent =
                    "Unable to load the JARVIS voice.";

                return false;
            }
        }


        // Start loading the model as soon as the page opens.
        const ttsReadyPromise =
            initializeTTS();


        /* =====================================================
           JARVIS SPEAK
        ===================================================== */



        async function speak(text) {

            output.textContent = text;

            if (!jarvisTTS || !ttsReady) {

                status.textContent =
                    "Loading JARVIS voice...";

                const ready =
                    await ttsReadyPromise;

                if (!ready || !jarvisTTS) {

                    console.error(
                        "JARVIS TTS is not available."
                    );

                    return;
                }
            }


            /*
             * Stop any previous JARVIS audio.
             */

            if (currentAudio) {

                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;

            }


            if (currentAudioURL) {

                URL.revokeObjectURL(
                    currentAudioURL
                );

                currentAudioURL = null;
            }


            try {

                orb.classList.add("active");

                status.textContent =
                    "JARVIS speaking...";


                /*
                 * Generate speech using the fixed
                 * British male Kokoro voice.
                 */

                const audio =
                    await jarvisTTS.generate(
                        text,
                        {
                            voice:
                                JARVIS_VOICE,

                            speed: 0.88
                        }
                    );


                /*
                 * Convert the generated waveform
                 * into a playable WAV Blob.
                 */

                let blob;

                if (typeof audio.toBlob === "function") {
                    blob = audio.toBlob();
                } else if (audio.audio && audio.sampling_rate) {
                    blob = audio.toBlob
                        ? audio.toBlob()
                        : null;
                }

                if (!blob) {
                    throw new Error(
                        "Kokoro returned audio in an unsupported format."
                    );
                }

                currentAudioURL =
                    URL.createObjectURL(blob);

                currentAudio =
                    new Audio(
                        currentAudioURL
                    );

                currentAudio.volume = 1;


                currentAudio.onended =
                    function () {

                        orb.classList.remove(
                            "active"
                        );

                        status.textContent =
                            passiveMode
                                ? 'Listening for "Hey JARVIS"...'
                                : "Awaiting command...";

                        if (currentAudioURL) {

                            URL.revokeObjectURL(
                                currentAudioURL
                            );

                            currentAudioURL = null;
                        }

                        currentAudio = null;
                    };


                currentAudio.onerror =
                    function (error) {

                        console.error(
                            "JARVIS audio error:",
                            error
                        );

                        orb.classList.remove(
                            "active"
                        );

                        status.textContent =
                            "Audio playback error.";

                        currentAudio = null;
                    };


                await currentAudio.play();


            } catch (error) {

                console.error(
                    "JARVIS speech generation failed:",
                    error
                );

                orb.classList.remove(
                    "active"
                );

                status.textContent =
                    "JARVIS voice error.";
            }
        }


        /* =====================================================
           START JARVIS
        ===================================================== */

        function startJarvis() {

            if (!recognition) {
                output.textContent =
                    "Speech recognition is not supported in this browser.";
                return;
            }

            if (jarvisRunning) {
                return;
            }

            jarvisRunning = true;
            passiveMode = true;

            mode.textContent = "PASSIVE MODE";
            mode.className = "mode passive";

            status.textContent = "Requesting permissions...";

            /*
               Ask Chrome for microphone permission.
            */
            try {
                recognition.start();
            } catch (error) {
                console.log(error);
            }

            /*
               Attempt a popup from the user's button click.
               Chrome may allow it automatically because this
               code is running directly from the button click.
            */
            const popup = window.open(
                "about:blank",
                "_blank"
            );

            if (popup) {
                popup.close();

                status.textContent =
                    "Microphone and popup access ready.";
            } else {
                status.textContent =
                    "Microphone ready. Popups may be blocked.";
            }

            /*
               Give the browser a moment before JARVIS speaks.
            */
            setTimeout(() => {

                speak(
                    "JARVIS online. Say Hey JARVIS when you require assistance."
                );

            }, 800);
        }


        /* =====================================================
           ACTIVATE JARVIS
        ===================================================== */

        function activateJarvis() {

            passiveMode = false;


            mode.textContent =
                "ACTIVE MODE";

            mode.className =
                "mode active-text";


            status.textContent =
                "Awaiting command...";


            speak("Yes?");


            /*
               Give the voice a moment to finish.
            */

            setTimeout(() => {

                restartRecognition();

            }, 1000);
        }


        /* =====================================================
           PROCESS COMMAND
        ===================================================== */

        function processCommand(command) {

            console.log("Command:", command);


            /* =============================================
               REMOVE WAKE WORD IF PRESENT
            ============================================= */

            command = command
                .replace("hey jarvis", "")
                .trim();


            /* =============================================
               GREETINGS
            ============================================= */

            if (
                command === "hello" ||
                command === "hi" ||
                command.includes("hello jarvis")
            ) {

                speak("Good day. How may I assist you?");

                returnToPassive();

                return;
            }


            /* =============================================
               OPEN YOUTUBE
            ============================================= */

            if (
                command.includes("open youtube") ||
                command === "youtube"
            ) {

                speak("Opening YouTube.");

                setTimeout(() => {

                    window.open(
                        "https://www.youtube.com",
                        "_blank"
                    );

                }, 700);

                returnToPassive();

                return;
            }


            /* =============================================
               OPEN SPOTIFY
            ============================================= */

            if (
                command.includes("open spotify") ||
                command === "spotify"
            ) {

                speak("Opening Spotify.");

                setTimeout(() => {

                    window.open(
                        "https://open.spotify.com",
                        "_blank"
                    );

                }, 700);

                returnToPassive();

                return;
            }


            /* =============================================
               OPEN GOOGLE
            ============================================= */

            if (
                command.includes("open google") ||
                command === "google"
            ) {

                speak("Opening Google.");

                setTimeout(() => {

                    window.open(
                        "https://www.google.com",
                        "_blank"
                    );

                }, 700);

                returnToPassive();

                return;
            }


            /* =============================================
               SEARCH GOOGLE
            ============================================= */

            if (
                command.startsWith("search for") ||
                command.startsWith("google")
            ) {

                let search = command
                    .replace("search for", "")
                    .replace("google", "")
                    .trim();


                if (search.length === 0) {

                    speak("What would you like me to search for?");

                    returnToPassive();

                    return;
                }


                speak(
                    "Searching Google for " + search
                );


                setTimeout(() => {

                    window.open(
                        "https://www.google.com/search?q=" +
                        encodeURIComponent(search),
                        "_blank"
                    );

                }, 700);


                returnToPassive();

                return;
            }


            /* =============================================
               SEARCH YOUTUBE
            ============================================= */

            if (
                command.startsWith("video search for") ||
                command.startsWith("youtube")
            ) {

                let search = command
                    .replace("video search for", "")
                    .replace("youtube", "")
                    .trim();


                if (search.length === 0) {

                    speak("What would you like me to search for?");

                    returnToPassive();

                    return;
                }


                speak(
                    "Searching Youtube for " + search
                );


                setTimeout(() => {

                    window.open(
                        "https://www.youtube.com/results?search_query=" +
                        encodeURIComponent(search),
                        "_blank"
                    );

                }, 700);


                returnToPassive();

                return;
            }



            /* =============================================
               TIME
            ============================================= */

            if (
                command.includes("what time") ||
                command === "time" ||
                command.includes("current time")
            ) {

                const now = new Date();

                const time =
                    now.toLocaleTimeString(
                        [],
                        {
                            hour: "numeric",
                            minute: "2-digit"
                        }
                    );


                speak(
                    "The current time is " +
                    time
                );


                returnToPassive();

                return;
            }


            /* =============================================
               DATE
            ============================================= */

            if (
                command.includes("what date") ||
                command === "date" ||
                command.includes("today's date")
            ) {

                const now = new Date();

                const date =
                    now.toLocaleDateString(
                        [],
                        {
                            weekday: "long",
                            month: "long",
                            day: "numeric"
                        }
                    );


                speak(
                    "Today is " +
                    date
                );


                returnToPassive();

                return;
            }


            /* =============================================
               HELP
            ============================================= */

            if (
                command === "help" ||
                command.includes("what can you do")
            ) {

                speak(
                    "I can open websites, search Google, " +
                    "tell you the time and date, and respond " +
                    "to basic commands."
                );


                returnToPassive();

                return;
            }


            /* =============================================
               STOP JARVIS
            ============================================= */

            if (
                command.includes("stop listening") ||
                command.includes("go offline") ||
                command === "shutdown"
            ) {

                speak("Going offline.");

                setTimeout(() => {

                    stopJarvis();

                }, 1500);

                return;
            }


            /* =============================================
               UNKNOWN COMMAND
            ============================================= */

            speak(
                "I'm sorry, I don't currently have a command for that."
            );


            returnToPassive();
        }


        /* =====================================================
           RETURN TO PASSIVE MODE
        ===================================================== */

        function returnToPassive() {

            passiveMode = true;


            mode.textContent =
                "PASSIVE MODE";

            mode.className =
                "mode passive";


            status.textContent =
                'Listening for "Hey JARVIS"...';


            /*
               Give speech synthesis time to finish.
            */

            setTimeout(() => {

                restartRecognition();

            }, 1500);
        }


        /* =====================================================
           RESTART SPEECH RECOGNITION
        ===================================================== */

        function restartRecognition() {

            if (!jarvisRunning) {
                return;
            }


            if (!recognition) {
                return;
            }


            if (recognitionRunning) {
                return;
            }


            if (restarting) {
                return;
            }


            restarting = true;


            setTimeout(() => {

                try {

                    recognition.start();

                } catch (error) {

                    console.log(
                        "Recognition restart:",
                        error
                    );

                }


                restarting = false;

            }, 500);
        }


        /* =====================================================
           STOP JARVIS
        ===================================================== */

        function stopJarvis() {

            jarvisRunning = false;

            passiveMode = true;


            if (recognition) {

                try {
                    recognition.stop();
                } catch (error) { }

            }


            if (currentAudio) {

                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;

            }

            if (currentAudioURL) {

                URL.revokeObjectURL(
                    currentAudioURL
                );

                currentAudioURL = null;
            }


            recognitionRunning = false;


            mode.textContent =
                "OFFLINE";

            mode.className =
                "mode passive";


            status.textContent =
                "System offline";


            output.textContent =
                'Press "START JARVIS" to begin';


            orb.classList.remove("active");
        }


        /* =====================================================
           KEYBOARD SHORTCUT
        ===================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !jarvisRunning
                ) {

                    startJarvis();

                }

            }
        );

        /*
         * The page uses an inline button handler for START JARVIS.
         * Expose the function globally so the handler can still work
         * after converting this script to an ES module.
         */

        window.startJarvis = startJarvis;
        window.stopJarvis = stopJarvis;

    </script>

</body>
</html>
